<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>กล้องจับท่ามือ</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,'Prompt',sans-serif;color:#f2f0ff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,18,42,.85);padding:20px;text-align:center}
.ov.hide{display:none}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 28px;color:#fff;background:linear-gradient(135deg,#7c5cff,#ff5c93)}
button:disabled{opacity:.6}
p{margin:0;color:#d8d4ff;line-height:1.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ov" id="ov">
  <button id="go">เปิดกล้อง</button>
  <p id="msg" style="font-size:.85rem"></p>
</div>

<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const video=document.createElement('video');
video.playsInline=true;video.setAttribute('playsinline','');video.muted=true;
let lm=null,hearts=[],running=false;
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function resize(){
  const r=window.devicePixelRatio||1;
  cv.width=Math.round(innerWidth*r);cv.height=Math.round(innerHeight*r);
}
addEventListener('resize',resize);resize();

function fingers(p){
  const ext=(t,pip)=>d(p[t],p[0])>d(p[pip],p[0])*1.15;
  return{
    thumb:d(p[4],p[17])>d(p[3],p[17])*1.1&&d(p[4],p[5])>d(p[3],p[5]),
    index:ext(8,6),middle:ext(12,10),ring:ext(16,14),pinky:ext(20,18)
  };
}
function gesture(p){
  const f=fingers(p);
  if(f.middle&&!f.index&&!f.ring&&!f.pinky)return'middle';
  if(f.thumb&&f.index&&f.pinky&&!f.middle&&!f.ring)return'iloveyou';
  return null;
}

function loop(){
  const W=cv.width,H=cv.height,vw=video.videoWidth||640,vh=video.videoHeight||480;
  // เต็มจอแบบ cover: ขยายให้เต็มโดยไม่บิดสัดส่วน ส่วนเกินถูกตัดออก
  const s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s,dx=(W-dw)/2,dy=(H-dh)/2;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,dx,dy,dw,dh);ctx.restore();

  if(lm&&video.readyState>=2){
    try{
      const res=lm.detectForVideo(video,performance.now());
      for(const p of res.landmarks){
        const g=gesture(p);
        if(g){
          const cx=W-(dx+p[9].x*dw),cy=dy+p[9].y*dh;
          const handLen=Math.hypot((p[0].x-p[9].x)*dw,(p[0].y-p[9].y)*dh);
          const size=Math.max(60,handLen*2.2);
          ctx.font=size+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText(g==='middle'?'❤️':'😡',cx,cy-size*.9);
          if(g==='middle'&&Math.random()<.25)hearts.push({x:cx+(Math.random()-.5)*size,y:cy-size,t:0});
        }
      }
    }catch(e){}
  }
  const u=window.devicePixelRatio||1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  hearts.forEach(h=>{h.t+=.016;ctx.globalAlpha=Math.max(0,1-h.t);ctx.font=(28*u)+'px serif';ctx.fillText('💖',h.x,h.y-h.t*120*u)});
  ctx.globalAlpha=1;hearts=hearts.filter(h=>h.t<1);
  requestAnimationFrame(loop);
}

function camError(e){
  if(!window.isSecureContext)return'ต้องเปิดผ่าน https:// (หรือ localhost) กล้องถึงจะทำงาน';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return'เบราว์เซอร์นี้ไม่รองรับกล้อง ลองเปิดใน Chrome หรือ Safari';
  switch(e&&e.name){
    case'NotAllowedError':case'SecurityError':
      return'ไม่ได้รับอนุญาตใช้กล้อง — กดแม่กุญแจข้าง URL แล้วเลือก "อนุญาต" (ถ้าอยู่ใน CodePen/iframe ให้เปิดเป็นหน้าเต็ม)';
    case'NotFoundError':case'OverconstrainedError':
      return'ไม่พบกล้องในอุปกรณ์นี้';
    case'NotReadableError':case'AbortError':
      return'กล้องถูกใช้งานโดยแอปอื่นอยู่ ลองปิดแอปอื่นแล้วลองใหม่';
    default:
      return'เปิดกล้องไม่สำเร็จ: '+((e&&(e.message||e.name))||e);
  }
}

async function startCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no-mediadevices');
  let s;
  try{
    s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    if(e&&(e.name==='OverconstrainedError'||e.name==='NotFoundError'))
      s=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    else throw e;
  }
  video.srcObject=s;
  await video.play();
}

async function loadModel(){
  const base="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const {HandLandmarker,FilesetResolver}=await import(base+"/vision_bundle.mjs");
  const fs=await FilesetResolver.forVisionTasks(base+"/wasm");
  const modelAssetPath="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
  try{
    return await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath,delegate:"GPU"},runningMode:"VIDEO",numHands:2});
  }catch(e){
    return await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath,delegate:"CPU"},runningMode:"VIDEO",numHands:2});
  }
}

$('go').onclick=async()=>{
  $('go').disabled=true;$('msg').textContent='กำลังเปิดกล้อง...';
  try{
    await startCamera();
  }catch(e){
    $('msg').textContent=camError(e);$('go').disabled=false;return;
  }
  $('ov').classList.add('hide');
  if(!running){running=true;loop();}
  try{
    lm=await loadModel();
  }catch(e){
    // โมเดลโหลดไม่ได้: โชว์ข้อความแจ้งเตือนสั้น ๆ
    $('msg').textContent='โหลดโมเดลจับมือไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต แล้วรีเฟรชหน้านี้';
    $('go').style.display='none';$('ov').classList.remove('hide');
    $('ov').style.background='transparent';$('ov').style.justifyContent='flex-end';
  }
};
</script>
</body>
</html>
