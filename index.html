<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>วาดรูปด้วยมือ</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,'Prompt',sans-serif;color:#f2f0ff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,18,42,.85);padding:20px;text-align:center}
.ov.hide{display:none}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 28px;color:#fff;background:linear-gradient(135deg,#7c5cff,#ff5c93)}
button:disabled{opacity:.6}
#clr{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:10px 26px;background:rgba(20,18,42,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none}
p{margin:0;color:#d8d4ff;line-height:1.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="clr">ล้าง</button>
<div class="ov" id="ov">
  <p>ชูนิ้วชี้เพื่อวาด · กำมือ/เปิดมือเพื่อหยุดวาด</p>
  <button id="go">เปิดกล้อง</button>
  <p id="msg" style="font-size:.85rem"></p>
</div>

<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const video=document.createElement('video');
video.playsInline=true;video.setAttribute('playsinline','');video.muted=true;
let lm=null,running=false;
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

// ชั้นวาดรูป (เก็บเส้นที่วาดไว้)
let layer=document.createElement('canvas'),lctx=layer.getContext('2d');
function resize(){
  const r=window.devicePixelRatio||1,w=Math.round(innerWidth*r),h=Math.round(innerHeight*r);
  const old=document.createElement('canvas');old.width=layer.width;old.height=layer.height;
  if(layer.width&&layer.height)old.getContext('2d').drawImage(layer,0,0);
  cv.width=w;cv.height=h;layer.width=w;layer.height=h;
  if(old.width&&old.height)lctx.drawImage(old,0,0,w,h);
}
addEventListener('resize',resize);resize();

// ชี้นิ้วชี้อย่างเดียว = วาด
function pointing(p){
  const ext=(t,pip)=>d(p[t],p[0])>d(p[pip],p[0])*1.15;
  return ext(8,6)&&!ext(12,10)&&!ext(16,14)&&!ext(20,18);
}

let sx=0,sy=0,pen=false,onFrames=0,offFrames=0;
function loop(){
  const W=cv.width,H=cv.height,u=window.devicePixelRatio||1;
  const vw=video.videoWidth||640,vh=video.videoHeight||480;
  const s=Math.max(W/vw,H/vh),dw=vw*s,dh=vh*s,dx=(W-dw)/2,dy=(H-dh)/2;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,dx,dy,dw,dh);ctx.restore();

  let tip=null;
  if(lm&&video.readyState>=2){
    try{
      const res=lm.detectForVideo(video,performance.now());
      const p=res.landmarks[0];
      if(p&&pointing(p))tip={x:W-(dx+p[8].x*dw),y:dy+p[8].y*dh};
    }catch(e){}
  }

  if(tip){
    offFrames=0;onFrames++;
    if(onFrames>=2){
      if(!pen){sx=tip.x;sy=tip.y;pen=true;}
      else{
        const nx=sx+(tip.x-sx)*.55,ny=sy+(tip.y-sy)*.55;
        lctx.strokeStyle='#ff5c93';lctx.lineWidth=6*u;lctx.lineCap='round';lctx.lineJoin='round';
        lctx.shadowColor='rgba(255,92,147,.7)';lctx.shadowBlur=10*u;
        lctx.beginPath();lctx.moveTo(sx,sy);lctx.lineTo(nx,ny);lctx.stroke();
        sx=nx;sy=ny;
      }
    }
  }else{
    onFrames=0;
    if(++offFrames>=3)pen=false;
  }

  ctx.drawImage(layer,0,0);
  if(tip){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2*u;ctx.beginPath();ctx.arc(tip.x,tip.y,8*u,0,7);ctx.stroke();}
  requestAnimationFrame(loop);
}

$('clr').onclick=()=>lctx.clearRect(0,0,layer.width,layer.height);

function camError(e){
  if(!window.isSecureContext)return'ต้องเปิดผ่าน https:// (หรือ localhost) กล้องถึงจะทำงาน';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return'เบราว์เซอร์นี้ไม่รองรับกล้อง ลองเปิดใน Chrome หรือ Safari';
  switch(e&&e.name){
    case'NotAllowedError':case'SecurityError':
      return'ไม่ได้รับอนุญาตใช้กล้อง — กดแม่กุญแจข้าง URL แล้วเลือก "อนุญาต" (ถ้าอยู่ใน CodePen/iframe ให้เปิดเป็นหน้าเต็ม)';
    case'NotFoundError':case'OverconstrainedError':
      return'ไม่พบกล้องในอุปกรณ์นี้';
    case'NotReadableError':case'AbortError':
      return'กล้องถูกใช้งานโดยแอปอื่นอยู่ ลองปิดแอปอื่นแล้วลองใหม่';
    default:
      return'เปิดกล้องไม่สำเร็จ: '+((e&&(e.message||e.name))||e);
  }
}

async function startCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no-mediadevices');
  let s;
  try{
    s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    if(e&&(e.name==='OverconstrainedError'||e.name==='NotFoundError'))
      s=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
    else throw e;
  }
  video.srcObject=s;
  await video.play();
}

async function loadModel(){
  const base="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const {HandLandmarker,FilesetResolver}=await import(base+"/vision_bundle.mjs");
  const fs=await FilesetResolver.forVisionTasks(base+"/wasm");
  const modelAssetPath="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
  try{
    return await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath,delegate:"GPU"},runningMode:"VIDEO",numHands:1});
  }catch(e){
    return await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath,delegate:"CPU"},runningMode:"VIDEO",numHands:1});
  }
}

$('go').onclick=async()=>{
  $('go').disabled=true;$('msg').textContent='กำลังเปิดกล้อง...';
  try{
    await startCamera();
  }catch(e){
    $('msg').textContent=camError(e);$('go').disabled=false;return;
  }
  $('ov').classList.add('hide');$('clr').style.display='block';
  if(!running){running=true;loop();}
  try{
    lm=await loadModel();
  }catch(e){
    $('msg').textContent='โหลดโมเดลจับมือไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต แล้วรีเฟรชหน้านี้';
    document.querySelector('#ov p').style.display='none';$('go').style.display='none';
    $('ov').classList.remove('hide');$('ov').style.background='transparent';$('ov').style.justifyContent='flex-end';
  }
};
</script>
</body>
</html>
